<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LIVE CHAT | AzerothMarket</title>
  <meta name="description" content="Contact AzerothMarket through official LIVE CHAT support.">
  <style>
    :root{--bg:#07090d;--panel:#0d1118;--line:#202733;--text:#f3f6fa;--muted:#9aa4b2;--accent:#8ff0c0}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}
    body{display:grid;place-items:center;padding:24px}
    .panel{width:min(680px,100%);padding:48px 32px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:18px}
    .brand{display:inline-block;margin-bottom:18px;color:var(--accent);font-weight:900;letter-spacing:.12em}
    h1{margin:0 0 10px;font-size:34px;line-height:1.1}
    p{margin:0;color:var(--muted)}
    .status{display:inline-flex;align-items:center;gap:8px;margin-top:24px;padding:10px 15px;border:1px solid #365d4d;border-radius:999px;background:#0b1511;color:#dffbed;font-weight:800}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
    .back{display:inline-block;margin-top:22px;color:#b8c2ce;text-decoration:none}
    .back:hover{color:var(--accent)}
  </style>
</head>
<body>
  <main class="panel">
    <div class="brand">AZEROTHMARKET</div>
    <h1>Opening LIVE CHAT</h1>
    <p>Please wait while our official support chat loads.</p>
    <div class="status"><span class="dot"></span> OFFICIAL SUPPORT</div>
    <br>
    <a class="back" href="/">Return to AzerothMarket</a>
  </main>

  <script>
    var Tawk_API = Tawk_API || {};
    var Tawk_LoadStart = new Date();
    Tawk_API.onLoad = function(){
      Tawk_API.maximize();
    };
    (function(){
      var s1=document.createElement('script'),s0=document.getElementsByTagName('script')[0];
      s1.async=true;
      s1.src='https://embed.tawk.to/6aaa49c634861b344aabbaa0/1k2kj0c22';
      s1.charset='UTF-8';
      s1.setAttribute('crossorigin','*');
      s0.parentNode.insertBefore(s1,s0);
    })();
  </script>
</body>
</html>
